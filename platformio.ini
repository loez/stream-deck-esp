; Stream Deck de toque - LCDWiki ES3C28P. Grade 3x2 (paisagem 320x240). Core 1: LVGL/toque/display.
; Cada placa tem um src/board_<nome>.cpp (pinos, painel, toque, backlight; interface em include/board.h) e um [env:<nome>] como este.
; O servidor calcula a grade pelo tamanho/densidade da tela que a placa informa (BOARD em board_<nome>.cpp).
[env:es3c28p]
build_src_filter = +<*> -<board_*.cpp> +<board_es3c28p.cpp>
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = dio_opi
board_upload.flash_size = 16MB
lib_deps =
  lvgl/lvgl@^9.2.2
  bblanchon/ArduinoJson@^7.0.0
build_flags =
  -O2
  -DCORE_DEBUG_LEVEL=0
  -Wl,--wrap=esp_mbedtls_mem_calloc
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DBOARD_HAS_PSRAM
  -DLV_CONF_INCLUDE_SIMPLE
  -I$PROJECT_INCLUDE_DIR
