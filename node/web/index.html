<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stream Deck</title>
<style>
  :root { --bg:#1b1c20; --bg2:#222328; --card:#2c2d33; --card2:#34353c; --line:#3a3b43; --txt:#f2f2f5; --dim:#9fa0ab; --acc:#19d9c8; --ok:#35d07f; --bad:#ff5c5c; }
  * { box-sizing: border-box; }
  :root { color-scheme: dark; }
  ::-webkit-scrollbar { width:10px; height:10px; } ::-webkit-scrollbar-corner { background:transparent; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:#3d3e48; border-radius:10px; border:2px solid transparent; background-clip:padding-box; min-height:36px; }
  ::-webkit-scrollbar-thumb:hover { background:#5b5c6a; background-clip:padding-box; border:2px solid transparent; }
  ::-webkit-scrollbar-thumb:active { background:var(--acc); background-clip:padding-box; border:2px solid transparent; }
  [hidden] { display:none !important; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--txt); font:15px/1.4 -apple-system, "SF Pro Text", system-ui, sans-serif; }
  .app { display:grid; grid-template-columns:minmax(0,1fr) clamp(220px, 23vw, 300px); height:100vh; }
  .left { overflow:auto; position:relative; min-width:0; }
  .lib { border-left:1px solid var(--line); background:var(--bg2); display:flex; flex-direction:column; min-height:0; }
  .top { display:flex; align-items:center; gap:14px; padding:10px 20px; position:relative; }
  h1 { font-size:22px; margin:0; font-weight:700; letter-spacing:.2px; }
  .status { display:flex; align-items:center; gap:7px; padding:4px 8px; border:0; background:transparent; color:var(--txt); font-size:14px; border-radius:8px; }
  .status:hover, .iconbtn:hover { background:var(--card); }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--bad); }
  .dot.on { background:var(--ok); box-shadow:0 0 8px var(--ok); } .dot.warn { background:#ffb300; box-shadow:0 0 8px #ffb300; }
  .top .sp { flex:1; }
  .iconbtn { border:0; background:transparent; color:var(--txt); padding:6px; border-radius:8px; display:grid; place-items:center; }
  .pop { position:absolute; z-index:20; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; box-shadow:0 12px 32px rgba(0,0,0,.5); }
  #statusmenu { top:50px; left:24px; width:min(330px, calc(100% - 32px)); }
  #pagemenu { width:520px; max-width:calc(100% - 16px); }
  .pop .row + .row { margin-top:10px; }
  .pages { display:flex; align-items:flex-start; gap:4px; padding:2px 16px 4px; border-bottom:1px solid var(--line); }
  .strip { display:flex; gap:8px; overflow-x:auto; padding:2px 2px 0; flex:1; }
  .strip::-webkit-scrollbar { display:none; }
  .nav { border:0; background:transparent; color:var(--dim); padding:5px 4px; border-radius:8px; font-size:18px; line-height:1; } .nav svg { width:16px; height:16px; } .nav:hover { color:var(--txt); background:var(--card); }
  .nav.add { color:var(--txt); font-size:20px; }
  .ptile { flex:none; display:flex; flex-direction:column; align-items:center; gap:0; }
  .ptile .pi { width:32px; height:32px; border-radius:9px; background:var(--card2); display:grid; place-items:center; cursor:pointer; overflow:hidden; border:2px solid transparent; position:relative; }
  .ptile .pi img { width:100%; height:100%; object-fit:cover; display:block; }
  .ptile .ini { font-weight:700; font-size:14px; color:var(--txt); }
  .ptile.on .pi { border-color:var(--acc); } .ptile.live .pi::after { content:""; position:absolute; right:2px; top:2px; width:7px; height:7px; border-radius:50%; background:var(--ok); box-shadow:0 0 5px var(--ok); }
  .ptile .chev { border:0; background:transparent; color:var(--dim); padding:0; height:12px; display:grid; place-items:center; } .ptile .chev svg { width:12px; height:12px; } .ptile .chev:hover { color:var(--txt); background:transparent; }
  .ptile.on::after { content:""; width:24px; height:2px; border-radius:2px; background:var(--acc); }
  .crumb { display:flex; align-items:center; gap:10px; padding:6px 16px; font-size:13px; color:var(--dim); } .crumb b { color:var(--txt); }
  .crumb button { display:flex; align-items:center; gap:4px; padding:3px 10px 3px 6px; font-size:13px; } .crumb svg { width:14px; height:14px; }
  .tilebar { display:flex; gap:10px; align-items:center; justify-content:center; flex-wrap:wrap; font-size:13px; color:var(--dim); padding:0 16px 8px; min-height:26px; } .tilebar button { padding:4px 12px; font-size:13px; } .tilebar b { color:var(--txt); }
  .rectsel { grid-column:var(--gc); grid-row:var(--gr); border:2px dashed var(--acc); border-radius:14px; background:rgba(25,217,200,.12); pointer-events:none; z-index:3; }
  .stage { display:flex; justify-content:center; padding:16px 16px 8px; }
  .device { background:linear-gradient(#3b3c42,#303136); border:1px solid #4a4b53; border-radius:20px; padding:12px 18px 18px; box-shadow:0 10px 30px rgba(0,0,0,.35); }
  .device .brand { text-align:center; font-size:17px; letter-spacing:2px; color:#c9cad2; margin:0 0 8px; font-weight:600; }
  .grid { display:grid; gap:10px; justify-content:center; }
  .btn { width:calc(var(--w) * var(--k, 0.95) * 1px); height:calc(var(--h) * var(--k, 0.95) * 1px); position:relative; border-radius:14px; overflow:hidden; cursor:pointer; background:#0c0c0e; outline:3px solid transparent; transition:outline-color .12s, transform .08s; box-shadow:0 4px 10px rgba(0,0,0,.5); }
  .btn:hover { transform:translateY(-1px); } .btn.sel { outline-color:var(--acc); }
  .btn img { width:100%; height:100%; display:block; pointer-events:none; }
  .btn.moving { opacity:.45; }
  body.dragging .btn { outline:2px dashed #55565f; } .btn.over { outline:3px solid var(--acc) !important; transform:scale(1.04); }
  .gifbadge { position:absolute; right:4px; top:4px; font-size:9px; font-weight:700; letter-spacing:.5px; padding:1px 5px; border-radius:6px; background:rgba(0,0,0,.6); color:var(--acc); pointer-events:none; }
  .ghost { position:absolute; inset:0; display:flex; flex-direction:column; gap:2px; align-items:center; justify-content:center; background:rgba(25,217,200,.14); color:var(--acc); pointer-events:none; }
  .ghost svg { width:34px; height:34px; } .ghost small { color:var(--acc); font-size:11px; }
  .config { padding:0 28px 40px; }
  .cfg-head { display:flex; align-items:center; justify-content:space-between; padding:16px 0 12px; border-bottom:1px solid var(--line); font-size:16px; }
  .cfg-body { display:grid; grid-template-columns:auto minmax(0,1fr); gap:30px; padding-top:18px; max-width:980px; }
  .tile { border-radius:16px; overflow:hidden; border:2px solid var(--line); background:#0c0c0e; position:relative; } .tile img { width:100%; height:100%; display:block; }
  button.icon { border:0; background:transparent; color:var(--dim); padding:6px; } button.icon:hover { color:var(--bad); background:transparent; }
  .titlerow { display:flex; align-items:center; gap:12px; } .titlerow label { margin:0; font-size:15px; text-transform:none; letter-spacing:0; color:var(--txt); }
  .empty { color:var(--dim); padding:34px 0; text-align:center; }
  .search { padding:10px 10px 6px; display:flex; gap:8px; }
  .search input { flex:1; padding:7px 11px; font-size:13px !important; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--txt); font:inherit; }
  #lib { overflow:auto; padding:4px 6px 14px 10px; flex:1; }
  .grp { background:var(--card); border:1px solid var(--line); border-radius:11px; margin-bottom:6px; overflow:hidden; }
  .grp-h { display:flex; align-items:center; gap:8px; padding:7px 11px; cursor:pointer; font-size:13px; }
  .grp-h .gi { display:grid; place-items:center; width:20px; height:20px; color:var(--txt); } .grp-h .gi svg { width:16px; height:16px; } .grp-h .gi img { width:20px; height:20px; border-radius:5px; }
  .grp-h .gn { flex:1; font-weight:600; } .car { color:var(--dim); transition:transform .15s; transform:rotate(-90deg); display:grid; } .car svg { width:14px; height:14px; } .car.open { transform:none; }
  .item { display:flex; align-items:center; gap:9px; padding:5px 11px 5px 16px; cursor:grab; color:#dcdce3; border-top:1px solid #35363d; font-size:12.5px; line-height:1.25; }
  .item:hover { background:var(--card2); } .item:active { cursor:grabbing; }
  .item .ii { width:18px; height:18px; display:grid; place-items:center; flex:none; color:var(--dim); } .item .ii svg { width:15px; height:15px; } .item .ii img { width:18px; height:18px; border-radius:4px; object-fit:contain; }
  select { width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--txt); font:inherit; }
  label { display:block; font-size:12px; text-transform:uppercase; letter-spacing:.6px; color:var(--dim); margin:16px 0 6px; }
  input[type=text], input[type=password], input[list], input[data-apps] { width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--txt); font:inherit; }
  input:focus, select:focus { outline:2px solid var(--acc); outline-offset:-1px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  button { font:inherit; padding:9px 14px; border-radius:10px; border:1px solid var(--line); background:var(--card2); color:var(--txt); cursor:pointer; }
  button:hover { background:#3f4048; }
  button.primary { background:var(--acc); border-color:var(--acc); color:#06312e; font-weight:650; } button.primary:hover { filter:brightness(1.08); background:var(--acc); }
  button.danger { color:var(--bad); } button:disabled { opacity:.45; cursor:default; }
  input[type=color] { width:44px; height:38px; padding:2px; border-radius:10px; border:1px solid var(--line); background:var(--bg); }
  .msg { min-height:20px; font-size:13px; color:var(--dim); margin-top:10px; } .msg.ok { color:var(--ok); } .msg.bad { color:var(--bad); }
  small { color:var(--dim); }
  .gridbar { display:flex; gap:12px; align-items:center; flex-wrap:wrap; font-size:13px; color:var(--dim); }
  .gridbar label { display:flex; gap:6px; align-items:center; margin:0; text-transform:none; letter-spacing:0; font-size:13px; color:var(--txt); } .gridbar select { width:auto; padding:6px 8px; }
  .step { border:1px solid var(--line); border-radius:12px; padding:4px 12px 12px; margin:8px 0; background:var(--bg2); }
  .steprow { display:flex; gap:6px; align-items:center; margin-top:10px; }
  .steprow .n { width:22px; height:22px; border-radius:50%; background:var(--line); display:grid; place-items:center; font-size:12px; flex:none; }
  .steprow select { flex:1; padding:7px 10px; } .steprow button { padding:5px 9px; font-size:13px; }
  .chk { display:flex; gap:8px; align-items:center; text-transform:none !important; letter-spacing:0 !important; font-size:13px !important; color:var(--txt) !important; margin:10px 0 0 !important; } .chk input { width:auto; }
  input.hk { cursor:pointer; caret-color:transparent; } input.hk:focus { outline-color:var(--acc); background:#10201f; }
  .bindbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:12px 0 0; font-size:13px; }
  .pagebar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; } .pagebar input[type=text] { width:170px; padding:7px 10px; } .pagebar button { padding:7px 11px; font-size:13px; }
  .chip2 { display:inline-flex; gap:6px; align-items:center; padding:4px 6px 4px 10px; border-radius:99px; background:#10302d; border:1px solid var(--acc); color:var(--txt); }
  .chip2 button { padding:0 6px; border:0; background:transparent; color:var(--dim); font-size:15px; line-height:1; cursor:pointer; } .chip2 button:hover { color:var(--bad); }
  .bindbar input[list], .bindbar input[data-apps] { width:150px; padding:6px 9px; } .bindbar button.sm { padding:6px 10px; font-size:13px; }
  .plug-box { margin-top:12px; } .plug-box iframe { width:100%; height:430px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color-scheme:normal; }   /* color-scheme:normal = igual ao da página do plugin (sem tema declarado): o fundo do iframe fica transparente e aparece a cor do app (com o tema escuro do app o navegador pintava o iframe de branco) */
  details { margin-top:14px; } summary { cursor:pointer; color:var(--dim); font-size:13px; }
  .imp { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px; } .imp .nm { flex:1; } .imp .warn { color:#ffb300; font-size:12px; }
  .note { color:var(--dim); font-size:12px; margin-top:6px; }
  .modal-back { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:70; display:grid; place-items:center; padding:16px; }
  .modal { background:var(--card); border:1px solid var(--line); border-radius:14px; width:min(760px, 100%); max-height:min(640px, 90vh); display:flex; flex-direction:column; box-shadow:0 24px 60px rgba(0,0,0,.6); }
  .modal-head { display:flex; align-items:center; justify-content:space-between; padding:14px 18px 6px; font-size:17px; font-weight:650; }
  .tabs2 { display:flex; gap:4px; padding:0 14px; border-bottom:1px solid var(--line); }
  .tab2 { border:0; border-bottom:2px solid transparent; border-radius:0; background:transparent; color:var(--dim); padding:8px 12px; font-size:14px; } .tab2:hover { color:var(--txt); background:transparent; } .tab2.on { color:var(--txt); border-bottom-color:var(--acc); }
  .modal-body { padding:16px 18px 20px; overflow:auto; }
  .modal-body h3 { margin:0 0 8px; font-size:14px; } .modal-body h3 + .note { margin:-4px 0 10px; }
  .plrow { display:flex; align-items:center; gap:12px; padding:9px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .dropzone { border:2px dashed var(--line); border-radius:12px; padding:18px; text-align:center; color:var(--dim); font-size:13px; margin:8px 0; transition:.12s; } .dropzone.over { border-color:var(--acc); color:var(--txt); background:rgba(25,217,200,.08); }
  .saitem { font-size:13px; padding:2px 0; } .saitem i { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:8px; background:var(--dim); } .saitem i.ok { background:var(--ok); } .saitem i.bad { background:var(--bad); } .saitem small { color:var(--dim); margin-left:6px; }
  .devrow { padding:9px 0; border-bottom:1px solid var(--line); font-size:13px; } .devrow .devhead { display:flex; align-items:center; gap:10px; margin-bottom:6px; } .devrow .devhead b { flex:1; font-weight:600; } .devrow .row { margin:4px 0; } .devline { font-size:12px; color:var(--dim); } .devline.bad { color:#ff8a8a; }
  .plrm { padding:3px 10px; font-size:12px; opacity:.75; } .plrm:hover { opacity:1; color:#ff8a8a; }
  .plrow img { width:30px; height:30px; border-radius:7px; flex:none; object-fit:contain; background:var(--bg2); } .plrow .nm { flex:1; min-width:0; } .plrow .nm small { margin-left:6px; }
  .plrow .st { font-size:12px; color:var(--dim); display:flex; align-items:center; gap:6px; white-space:nowrap; } .plrow .st i { width:8px; height:8px; border-radius:50%; background:#666; display:inline-block; } .plrow .st i.ok { background:var(--ok); } .plrow .st i.bad { background:var(--bad); }
  .icpick { width:min(900px, 100%); max-height:min(700px, 92vh); } .icpick .modal-body { display:flex; gap:16px; padding:12px 18px 16px; min-height:0; flex:1; overflow:hidden; }
  .ic-main { flex:1; min-width:0; display:flex; flex-direction:column; gap:8px; } .ic-side { width:210px; flex:none; display:flex; flex-direction:column; gap:8px; overflow:auto; }
  .ic-chips { display:flex; flex-wrap:wrap; gap:6px; } .ic-chip { padding:3px 10px; border-radius:99px; font-size:12px; background:var(--bg); color:var(--dim); } .ic-chip.on { background:#10302d; border-color:var(--acc); color:var(--txt); }
  .ic-grid { flex:1; min-height:0; overflow:auto; display:grid; grid-template-columns:repeat(auto-fill, minmax(58px, 1fr)); gap:6px; align-content:start; padding:2px; }
  .ic-cell { aspect-ratio:1; padding:8px; border-radius:10px; border:2px solid transparent; display:grid; place-items:center; } .ic-cell img { width:100%; height:100%; object-fit:contain; pointer-events:none; } .ic-cell.on { border-color:var(--acc); }
  .ic-prev { width:100%; aspect-ratio:1; border-radius:14px; display:grid; place-items:center; padding:20%; box-sizing:border-box; } .ic-prev img { width:100%; height:100%; object-fit:contain; }
  .ic-side input[type=color] { width:100%; height:34px; padding:2px; border-radius:8px; border:1px solid var(--line); background:var(--bg); } .ic-side label { font-size:12px; color:var(--dim); margin:2px 0 0; }
  .picker { min-width:220px; position:fixed; z-index:80; background:var(--card); border:1px solid var(--line); border-radius:10px; box-shadow:0 12px 30px rgba(0,0,0,.55); overflow-y:auto; padding:4px; overscroll-behavior:contain; }
  .picker .pk { padding:6px 10px; border-radius:7px; font-size:13px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .picker .pk:hover, .picker .pk.on { background:var(--card2); } .picker .pk.none { color:var(--dim); cursor:default; white-space:normal; }
  #libtoggle, #libclose { display:none; }
  #toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:var(--card2); border:1px solid var(--line); padding:10px 16px; border-radius:12px; z-index:60; box-shadow:0 10px 28px rgba(0,0,0,.5); font-size:14px; }
  /* janela estreita (ou app em janela pequena): a biblioteca vira uma gaveta à direita; o painel de configuração empilha */
  @media (max-width: 900px) {
    .app { grid-template-columns:1fr; height:auto; min-height:100vh; }
    .left { overflow:visible; height:auto; }
    .lib { position:fixed; top:0; right:0; bottom:0; width:min(340px, 92vw); z-index:40; border-left:1px solid var(--line); transform:translateX(100%); transition:transform .2s ease; box-shadow:-14px 0 34px rgba(0,0,0,.55); }
    body.lib-open .lib { transform:none; } body.lib-open.lib-peek .lib { transform:translateX(100%); }
    #libtoggle { display:grid; } #libclose { display:grid; margin-left:auto; }
    .search { align-items:center; }
    .top { padding:12px 16px; gap:10px; } h1 { font-size:22px; } .pages { padding:6px 12px 10px; } .stage { padding:16px 8px 8px; }
    .config { padding:0 16px 32px; } .cfg-body { grid-template-columns:1fr; gap:18px; } .cfg-left { display:flex; flex-direction:column; align-items:flex-start; }
    .device { padding:12px 14px 16px; border-radius:18px; } .device .brand { font-size:18px; margin-bottom:8px; }
    .grid { gap:10px; }
  }
  @media (max-width: 560px) {
    .status span#board { display:none; } h1 { font-size:19px; } .titlerow { flex-direction:column; align-items:stretch; gap:6px; }
    .plug-box iframe { height:380px; } .bindbar input[list] { width:120px; }
  }
  @media (max-height: 640px) { .stage { padding-top:10px; } }
</style>
</head>
<body>
<div class="app">
  <div class="left">
    <header class="top">
      <h1>Stream Deck</h1>
      <button class="status" id="statusbtn"><span class="dot" id="dot"></span><span id="board" data-i18n>Aguardando a placa</span><span id="statuschev"></span></button>
      <div class="sp"></div>
      <button class="iconbtn" id="libtoggle" title="Biblioteca de ações"><span id="libic"></span></button>
      <button class="iconbtn" id="gearbtn" title="Configurações"><span id="gearic"></span></button>
      <div class="pop" id="statusmenu" hidden>
        <div class="row"><small id="boardinfo"></small></div>
        <div class="row"><button id="pairbtn" data-i18n title="Abre uma janela de 90 s em que a placa recebe a chave de acesso (uma vez)">Parear placa</button>
        <button id="revoke" class="danger" data-i18n title="Gera uma nova chave: a placa perde o acesso até ser pareada de novo">Revogar acesso</button></div>
      </div>
    </header>
    <div class="pages" id="tabs"></div>
    <div class="pop" id="pagemenu" hidden></div>
    <div class="crumb" id="crumb" hidden></div>
    <div class="stage"><div class="device"><div class="brand">Stream Deck</div><div class="grid" id="grid"></div></div></div>
    <div class="tilebar" id="tilebar"></div>
    <section class="config" id="panel"></section>
  </div>
  <aside class="lib">
    <div class="search"><input type="text" id="q" placeholder="Pesquisar ações" autocomplete="off"><button class="iconbtn" id="libclose" title="Fechar"><span id="closeic"></span></button></div>
    <div id="lib"></div>
  </aside>
</div>
<datalist id="apps"></datalist>
<div class="modal-back" id="settings" hidden>
  <div class="modal" role="dialog" aria-label="Configurações">
    <div class="modal-head"><span data-i18n>Configurações</span><button class="iconbtn" id="set_close" title="Fechar"><span id="set_closeic"></span></button></div>
    <div class="tabs2"><button class="tab2 on" data-tab="board" data-i18n>Placa e tela</button><button class="tab2" data-tab="auto" data-i18n>Modo autônomo</button><button class="tab2" data-tab="plugins" data-i18n>Plugins de Terceiros</button><button class="tab2" data-tab="backup" data-i18n>Backup</button></div>
    <div class="modal-body">
      <div id="set_board"><div class="gridbar" id="gridbar"></div></div>
      <div id="set_auto" hidden></div>
      <div id="set_plugins" hidden></div>
      <div id="set_backup" hidden></div>
    </div>
  </div>
</div>
<div id="toast" hidden></div>
<script>

// Campos (dentro de #fields): atualizam o rascunho sem redesenhar (não perde o foco); selects marcados com data-rr redesenham os campos.
function bindFields() {
  document.querySelectorAll('#fields [data-f], #fields_alt [data-f]').forEach(el => {
    const upd = () => {
      const v = el.type === 'checkbox' ? el.checked : el.type === 'number' ? +el.value : el.hasAttribute('data-num') ? (el.value === '' ? null : +el.value) : el.value;
      setAt(el.dataset.f, v);
      if (el.dataset.f.endsWith('.mode')) {   // fora do modo "em sequência" não existe "esperar"; alternar/sorteio precisam de 2+ passos
        const act = getAt(el.dataset.f.slice(0, el.dataset.f.lastIndexOf('.')));
        if (act.type === 'multi') {   // só a ação múltipla tem passos (o controle deslizante também tem um campo "mode")
        if (v !== 'seq') { act.steps = act.steps.filter(x => x.type !== 'delay'); act.keep = false; }
        if (v === 'cycle' || v === 'random') while (act.steps.length < 2) act.steps.push(DEFAULTS.app());
        if (!act.steps.length) act.steps.push(DEFAULTS.app());
        }
      }
      if (el.hasAttribute('data-rr')) redrawFields(); else fitCheck();
    };
    el.addEventListener(el.tagName === 'SELECT' || el.type === 'checkbox' ? 'change' : 'input', upd);
    if (el.classList.contains('hk')) el.addEventListener('keydown', (e) => {   // captura do atalho: aperte a combinação com o campo em foco
      e.preventDefault(); if (['Meta', 'Control', 'Alt', 'Shift'].includes(e.key)) return;
      if (e.key === 'Backspace' && !e.metaKey && !e.ctrlKey && !e.altKey) { el.value = ''; setAt(el.dataset.f, ''); return; }
      const k = keyFromEvent(e); if (!k) return;
      const mods = []; if (e.metaKey) mods.push('cmd'); if (e.ctrlKey) mods.push('ctrl'); if (e.altKey) mods.push('alt'); if (e.shiftKey) mods.push('shift');
      el.value = [...mods, k].join('+'); setAt(el.dataset.f, el.value); fitCheck();
    });
  });
}

// ---------- seletor de aplicativos (substitui o <datalist> nativo, que não rola): lista própria, filtra ao digitar, setas/Enter/Esc
let picker = null;
function closePicker() { if (picker) { picker.el.remove(); window.removeEventListener('scroll', picker.place, true); window.removeEventListener('resize', closePicker); picker = null; } }
function openPicker(inp) {
  closePicker();
  const el = document.createElement('div'); el.className = 'picker'; document.body.appendChild(el);
  const pk = picker = { el, inp, idx: -1, items: [], place: null };
  const render = () => {
    const q = inp.value.trim().toLowerCase();
    pk.items = apps.filter(a => !q || a.name.toLowerCase().includes(q));
    if (pk.idx >= pk.items.length) pk.idx = pk.items.length - 1;
    el.innerHTML = pk.items.map((a, i) => `<div class="pk ${i === pk.idx ? 'on' : ''}" data-i="${i}">${esc(a.name)}</div>`).join('') || `<div class="pk none">${t('Nenhum aplicativo com esse nome: pode digitar o nome mesmo assim.')}</div>`;
    pk.place();
  };
  pk.place = () => {
    const r = inp.getBoundingClientRect(), below = window.innerHeight - r.bottom - 12, above = r.top - 12, up = below < 170 && above > below, room = Math.max(90, up ? above : below);
    el.style.left = r.left + 'px'; el.style.width = r.width + 'px'; el.style.maxHeight = Math.min(280, room) + 'px';
    if (up) { el.style.top = 'auto'; el.style.bottom = (window.innerHeight - r.top + 4) + 'px'; } else { el.style.bottom = 'auto'; el.style.top = (r.bottom + 4) + 'px'; }
  };
  const choose = (i) => { const a = pk.items[i]; if (!a) return; closePicker(); inp.value = a.name; inp.dispatchEvent(new Event('input', { bubbles: true })); inp.dispatchEvent(new CustomEvent('apppick', { bubbles: true })); };   // fecha ANTES de avisar o campo: o evento 'input' redesenharia a lista e soltaria o item clicado (o clique pareceria "fora" do menu)
  el.addEventListener('mousedown', (e) => e.preventDefault());   // não tira o foco do campo ao clicar na lista
  el.addEventListener('click', (e) => { const it = e.target.closest('.pk[data-i]'); if (it) choose(+it.dataset.i); });
  inp.addEventListener('input', () => { if (picker === pk) { pk.idx = -1; render(); } });
  inp.addEventListener('keydown', (e) => {
    if (picker !== pk) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); pk.idx = Math.max(0, Math.min(pk.items.length - 1, pk.idx + (e.key === 'ArrowDown' ? 1 : -1))); render(); const on = el.querySelector('.pk.on'); if (on) on.scrollIntoView({ block: 'nearest' }); }
    else if (e.key === 'Enter' && pk.idx >= 0) { e.preventDefault(); choose(pk.idx); }
    else if (e.key === 'Enter') { closePicker(); inp.dispatchEvent(new CustomEvent('apppick', { bubbles: true })); }   // nome digitado inteiro + Enter
    else if (e.key === 'Escape') { e.stopPropagation(); closePicker(); }
    else if (e.key === 'Tab') closePicker();
  });
  window.addEventListener('scroll', pk.place, true); window.addEventListener('resize', closePicker);
  render();
}
document.addEventListener('focusin', (e) => { if (e.target.matches && e.target.matches('input[data-apps]')) { if (!picker || picker.inp !== e.target) openPicker(e.target); } else if (picker && !picker.el.contains(e.target)) closePicker(); });
document.addEventListener('mousedown', (e) => { if (picker && !picker.el.contains(e.target) && e.target !== picker.inp) closePicker(); });

    if (cfg && appNav && s.current === appNav.id) appNav = null;   // a placa já mostra a página que pedimos
    if (cfg && s.current !== live) {
      if (appNav && Date.now() < appNav.until) { /* o pedido desta janela ainda não chegou à placa: ignora a leitura antiga */ }
      else { appNav = null; live = cfg.current = s.current; markLive(); }   // a placa trocou de página (toque, troca automática por app em foco)
    }
    if (cfg && !(appNav && Date.now() < appNav.until)) followBoard(s.current);   // esta janela acompanha a placa; se houver algo não salvo sendo editado, espera e tenta de novo a cada leitura (nunca apaga o que está sendo digitado)
  } catch (e) { $('board').textContent = t('Servidor parado'); $('dot').className = 'dot'; }
}
$('pairbtn').onclick = async () => { await api(pairLeft > 0 ? '/api/pairing/stop' : '/api/pairing/start', j('POST')); status(); };   // clicar durante o pareamento cancela
$('revoke').onclick = async () => { if (!confirm(t('Revogar o acesso da placa? Ela só volta a funcionar depois de ser pareada de novo.'))) return; await api('/api/token/reset', j('POST')); status(); };
(async () => {
  await loadI18n();
  apps = await api('/api/apps'); pluginsInfo = await api('/api/plugins');
  $('apps').innerHTML = apps.map(a => `<option value="${esc(a.name)}">`).join('');
  bindDrop(); drawLib();
  window.addEventListener('dragover', (e) => { if (e.dataTransfer && [...(e.dataTransfer.types || [])].includes('Files') && !e.target.closest('#grid, #zip_drop')) e.preventDefault(); });   // soltar um arquivo fora da grade não pode abri-lo na janela do app
  window.addEventListener('drop', (e) => { if (e.target.closest('#grid, #zip_drop')) return; const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if (!f) return; e.preventDefault(); if (/\.zip$/i.test(f.name)) installZipFromWindow(f); }); $('q').oninput = drawLib;
  document.addEventListener('click', (e) => {   // fecha os menus ao clicar fora
    for (const [btn, box] of [['statusbtn', 'statusmenu']]) if (!$(box).hidden && !$(box).contains(e.target) && !$(btn).contains(e.target)) $(box).hidden = true;
    if (menuFor !== null && !$('pagemenu').contains(e.target) && !e.target.closest('.chev') && !e.target.closest('.picker')) { menuFor = null; drawPageMenu(); }   // a lista de apps é desenhada fora do menu: clicar nela não fecha o menu
  });
  $('libtoggle').onclick = () => document.body.classList.toggle('lib-open'); $('libclose').onclick = () => document.body.classList.remove('lib-open');
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { document.body.classList.remove('lib-open'); closeSettings(); if (rectSel) { rectSel = null; drawGrid(); } } });
  $('statusbtn').onclick = () => { $('statusmenu').hidden = !$('statusmenu').hidden; };
  $('gearbtn').onclick = () => { $('statusmenu').hidden = true; openSettings('board'); };
  $('set_close').onclick = closeSettings; $('settings').addEventListener('mousedown', (e) => { if (e.target === $('settings')) closeSettings(); });
  document.querySelectorAll('.tab2').forEach(b => b.onclick = () => setTab(b.dataset.tab));
  await load(); status(); setInterval(status, 1000); emptyPanel();
})();

// ícones fixos da barra
$('statuschev').innerHTML = IC.chev; $('gearic').innerHTML = IC.gear; $('libic').innerHTML = IC.app; $('closeic').innerHTML = IC.right; $('set_closeic').innerHTML = IC.x;
</script>
</body>
</html>
